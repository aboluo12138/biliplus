name: Firefox Package

# 只在自己的 ff-v* 标签上触发，两个原因：
# 1. 避免与上游 release-please 的 v* 标签冲突（同一个 tag 名不能重复创建）；
# 2. 与 release.yml（Chrome 发布）完全分离，互不干扰。
on:
  push:
    tags:
      - 'ff-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的标签，形如 ff-v1.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      # 把 secrets 映射成环境变量，才能在 if 里判断"是否配置了 AMO 密钥"
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # Node 20 已被 GitHub 标记为弃用（action 自带的 Node 20 运行时也被强制
          # 提升到 24），这里用当前 LTS。
          node-version: '22'

      - name: Resolve and validate the release tag
        id: release
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          if [[ ! "$tag" =~ ^ff-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "标签必须形如 ff-v1.2.0，实际收到：$tag" >&2
            exit 1
          fi

          version="${tag#ff-v}"
          manifest_version="$(jq -er '.version' manifest.json)"
          if [[ "$version" != "$manifest_version" ]]; then
            echo "标签版本 $version 与 manifest.json 的 $manifest_version 不一致" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run port invariants and build the Firefox package
        run: |
          node tests/firefox-port.test.js
          node tools/build-firefox.cjs

      - name: Sign for AMO (only when AMO secrets are configured)
        if: ${{ env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != '' }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          npx --yes web-ext@latest sign \
            --source-dir dist/firefox \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --artifacts-dir dist/signed

          # web-ext 的产物文件名不可控，这里统一改名，好在 Release 里一眼分辨：
          # 未签名的 xpi 供临时加载/上传 AMO，签名的那份可直接永久安装。
          mv dist/signed/*.xpi \
             "dist/signed/biliplus-firefox-${RELEASE_VERSION}-signed.xpi"

      - name: Publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Firefox $RELEASE_VERSION" \
              --generate-notes
          fi

          gh release upload "$RELEASE_TAG" dist/*.xpi dist/*.zip --clobber

          if compgen -G "dist/signed/*" >/dev/null; then
            gh release upload "$RELEASE_TAG" dist/signed/* --clobber
          fi
